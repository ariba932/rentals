{% extends "templates/web.html" %}

{% block page_content %}
<h1>{{ title |e }}</h1>


{% if doc.vehicle_image %}
    <img src="{{doc.vehicle_image}}" width="350" height="350" >
{% else %}
    <span> No Image Linked...</span>
{% endif %}
<br></br>


<a href="/book-a-ride/new?vehicle={{doc.name}}"  class="btn btn-primary rounded-pill px-3" type="button">Book a Ride </a>
<a href="/cars"  class="btn btn-primary rounded-pill px-3" type="button">Back </a>

{% endblock %}

<!-- this is a sample default web page template -->
